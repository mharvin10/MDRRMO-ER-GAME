<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;text-align:center;background:#FFF7E6}
#top{background:linear-gradient(180deg,#FF8C00,#FF6A00);padding:8px;border-bottom:3px solid #0A2A7A}
#top h1{margin:0;font-size:20px;color:white;text-shadow:1px 1px 0 #0A2A7A;line-height:1.1}
#top h1 span{color:#FFE600}
#top p{margin:2px 0 0;color:white;font-size:11px;font-weight:bold}
#hud{display:flex;justify-content:space-between;background:#0A2A7A;color:white;padding:7px 10px;font-weight:900;font-size:12px}
#hud span{color:#FFC700}
#stage{padding:10px}
.card{background:white;border:3px solid #0A2A7A;border-radius:15px;padding:12px;margin:0;text-align:left}
.card h2{margin:4px 0;text-align:center;color:#FF6A00;font-size:20px}
.btn{width:100%;background:white;border:2px solid #0A2A7A;border-radius:10px;padding:10px;margin:4px 0;font-size:14px;font-weight:700;text-align:left;line-height:1.35}
.btn:active{background:#FFE600}
.btn.correct{background:#6BCB77;color:white}
.btn.wrong{background:#FF6B6B;color:white}
.bigBtn{background:linear-gradient(#FFC700,#FF6A00);border:3px solid #0A2A7A;border-radius:15px;padding:13px;font-size:18px;font-weight:900;color:white;width:100%}
input{padding:10px;border-radius:10px;text-align:center;font-weight:900;width:160px;font-size:16px;border:2px solid #0A2A7A}
#phone{font-size:60px;animation:ring .5s infinite}
@keyframes ring{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
#ambulanceAnim{font-size:60px;position:relative;animation:drive 1.8s linear forwards}
@keyframes drive{0%{left:-60px}100%{left:calc(100% - 60px)}}
.vital{display:flex;gap:4px}
.vital div{flex:1;background:#FFF3CD;border:2px solid #FF6A00;border-radius:8px;padding:6px;font-size:11px}
.vital b{display:block;font-size:12px;color:#0A2A7A}
#timerBar{height:10px;background:#DDD;border-radius:10px;overflow:hidden;margin:6px 0}
#timerFill{height:100%;background:#FF4500;width:100%;transition:width 1s linear}
#feedback{font-weight:900;padding:9px;border-radius:10px;margin:6px 0;display:none;font-size:13px;line-height:1.4}
.scene{position:relative;width:100%;height:200px;background:linear-gradient(#87CEEB 0 60%, #8B4513 60% 68%, #555 68% 100%);border:3px solid #0A2A7A;border-radius:12px;overflow:hidden;margin:6px 0}
.sceneLabel{position:absolute;top:5px;left:0;width:100%;background:rgba(0,0,0,.7);color:white;font-size:11px;font-weight:900;padding:3px;z-index:20}
.patient{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:5}
.head{width:54px;height:54px;background:#FFDAB9;border:3px solid #333;border-radius:50%;margin:0 auto;position:relative;animation:headShake .8s infinite}
@keyframes headShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.eye{position:absolute;top:18px;width:8px;height:8px;background:#000;border-radius:50%;animation:blink 2s infinite}
.eye.l{left:11px}.eye.r{right:11px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
.mouth{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:18px;height:11px;background:#800000;border-radius:0 0 12px 12px;animation:mouthOpen .8s infinite}
@keyframes mouthOpen{0%,100%{height:5px}50%{height:12px}}
.body{width:105px;height:50px;background:#0A2A7A;border-radius:12px;margin:2px auto;position:relative;animation:breathing 1.2s infinite}
@keyframes breathing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.body span{color:white;font-size:11px;font-weight:900;line-height:50px}
.leg{position:absolute;bottom:0;width:26px;height:50px;background:#333;border-radius:0 0 10px 10px}
.leg.broken{transform-origin:top center;animation:legShake .6s infinite}
@keyframes legShake{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.blood{position:absolute;width:13px;height:13px;background:#FF0000;border-radius:50%;animation:bloodDrip 1s infinite}
@keyframes bloodDrip{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4) translateY(14px);opacity:0}}
.painText{position:absolute;top:32px;right:8px;background:#FF1744;color:white;font-weight:900;padding:4px 8px;border-radius:10px;animation:painPop .8s infinite;font-size:12px;z-index:15}
@keyframes painPop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.swelling{position:absolute;width:36px;height:36px;background:#FF6B6B;border-radius:50%;animation:swell 2s infinite}
@keyframes swell{0%{transform:scale(1)}100%{transform:scale(1.35)}}
.snake{position:absolute;bottom:22px;right:12px;font-size:42px;animation:snakeMove 1.5s infinite}
@keyframes snakeMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-10px) rotate(-10deg)}}
.motor{position:absolute;bottom:16px;right:8px;font-size:50px;transform:rotate(-20deg)}
.smoke{position:absolute;top:28px;left:18px;font-size:26px;animation:smokeUp 1.5s infinite}
@keyframes smokeUp{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-18px);opacity:0}}
.water{position:absolute;bottom:0;left:0;width:100%;height:42px;background:linear-gradient(#4D96FF,#0066CC);animation:wave 1s infinite}
@keyframes wave{0%,100%{height:42px}50%{height:48px}}
.heart{position:absolute;top:42px;left:50%;transform:translateX(-50%);font-size:32px;animation:heartBeat .7s infinite}
@keyframes heartBeat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.3)}}
.fire{position:absolute;bottom:18px;right:18px;font-size:50px;animation:fireFlick .4s infinite}
@keyframes fireFlick{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.firedScene{position:relative;width:100%;height:330px;background:#333;border:3px solid #FF1744;border-radius:12px;overflow:hidden;margin:8px 0}
.bossChar{position:absolute;bottom:18px;left:8px;text-align:center;animation:bossAngry .5s infinite}
@keyframes bossAngry{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bossHead{width:60px;height:60px;background:#FFCC99;border:3px solid #000;border-radius:50%;margin:0 auto;position:relative}
.bossMouth{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:22px;height:13px;background:#000;border-radius:12px 12px 0 0;animation:bossShout .4s infinite}
@keyframes bossShout{0%,100%{height:9px}50%{height:15px}}
.erChar{position:absolute;bottom:18px;right:8px;text-align:center;animation:erBeg 1s infinite}
@keyframes erBeg{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-2deg)}}
.erHead{width:56px;height:56px;background:#FFDAB9;border:3px solid #333;border-radius:50%;margin:0 auto;position:relative}
.erMouth{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:16px;height:9px;background:#000;border-radius:0 0 12px 12px;animation:erCryMouth .6s infinite}
@keyframes erCryMouth{0%,100%{height:6px}50%{height:11px}}
.patientChar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;animation:cryShake .6s infinite}
@keyframes cryShake{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-2deg)}}
.tear{position:absolute;top:26px;width:6px;height:11px;background:#4D96FF;border-radius:50%;animation:tearDrop 1s infinite}
@keyframes tearDrop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
.bossBubble{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:white;border:3px solid #FF1744;border-radius:12px;padding:6px 9px;font-weight:900;font-size:11px;z-index:20;width:94%;line-height:1.3}
.patientBubble{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#FFE600;border:3px solid #FF1744;border-radius:12px;padding:6px 9px;font-weight:900;font-size:12px;z-index:20;width:88%;animation:patientShout .6s infinite;line-height:1.3}
@keyframes patientShout{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.04)}}
.erBubble{position:absolute;top:132px;left:50%;transform:translateX(-50%);background:#B3E5FC;border:3px solid #0A2A7A;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12px;z-index:20;width:88%;animation:erBegBubble .8s infinite;line-height:1.3}
@keyframes erBegBubble{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.03)}}

.successScene{position:relative;width:100%;height:330px;background:linear-gradient(#87CEEB 0 60%, #6BCB77 60% 100%);border:3px solid #0A2A7A;border-radius:12px;overflow:hidden;margin:8px 0}
.bossHappy{position:absolute;bottom:18px;left:8px;text-align:center;animation:bossHappyJump .8s infinite}

.bossHappyMouth{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:22px;height:11px;background:#000;border-radius:0 0 12px 12px}
.patientHappy{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);text-align:center;animation:patientHappyJump .8s infinite}
@keyframes patientHappyJump{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.patientHappyMouth{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:20px;height:11px;background:#000;border-radius:0 0 12px 12px}

.bossBubble2{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:white;border:3px solid #0A2A7A;border-radius:12px;padding:6px 9px;font-weight:900;font-size:11px;z-index:20;width:94%;line-height:1.3}

.erBubble2{position:absolute;top:132px;left:50%;transform:translateX(-50%);background:#B3E5FC;border:3px solid #0A2A7A;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12px;z-index:20;width:88%;animation:erBegBubble .8s infinite;line-height:1.3}
</style>

var audioCtx=null; function unlock(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(audioCtx&&audioCtx.state=="suspended") audioCtx.resume(); }
document.addEventListener("click",unlock);
function beep(f,d,t,v,w){ if(!audioCtx) return; var o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type=t||"triangle"; o.frequency.value=f; var tt=audioCtx.currentTime+(w||0); g.gain.setValueAtTime(v||.25,tt); g.gain.exponentialRampToValueAtTime(.001,tt+d); o.start(tt); o.stop(tt+d); }
function playRing(){ for(var i=0;i<3;i++){ beep(800,.3,"square",.2,i*.6); } }
function playSiren(){ for(var i=0;i<3;i++){ beep(700,.4,"sawtooth",.15,i*.8); beep(950,.4,"sawtooth",.15,i*.8+.4); } }
function playGood(){ [523,659,784].forEach(function(n,i){ beep(n,.3,"triangle",.3,i*.15); }); }
function playBad(){ beep(200,.5,"sawtooth",.25,0); beep(150,.5,"sawtooth",.25,.2); }
function playTick(){ beep(1000,.08,"square",.15,0); }
function playFired(){ [400,300,200,100].forEach(function(n,i){ beep(n,.6,"sawtooth",.3,i*.4); }); }
function playWin(){ [523,659,784,1046].forEach(function(n,i){ beep(n,.4,"triangle",.3,i*.15); }); }

var score=0, callNum=0, lives=3, currentCase=null, usedCases=[], timerInt=null, timeLeft=30, currentStage=1, erName="GENO";

}
function handleWrong(){

  } else {
    playBad(); lives--; score=Math.max(0,score-100); updateHUD(); btn.classList.add("wrong");
    document.getElementById("feedback").style.display="block"; document.getElementById("feedback").style.background="#FFD5DC"; document.getElementById("feedback").innerHTML="❌ MALI! -100, -1 LIFE! Lives: "+lives+"<br>Score: "+score+"<br><b>Tama sana:</b> "+explain+"<br>⚠️ Proceed na...";
    if(lives<=0){ setTimeout(showFired,2200); return; }
    setTimeout(function(){ if(stage==1) askQ2(); else if(stage==2) askQ3(); else callDoneWithPenalty(); },2400);
  }
}
function callDone(){ showStage('<div class="card" style="text-align:center"><div style="font-size:50px">✅</div><h2>NAILIGTAS MO!</h2><p><b>'+currentCase.id+'</b> - Nadala sa ospital ng ligtas!</p><p>Score: '+score+' | Lives: '+("❤️".repeat(lives))+'</p><button class="bigBtn" onclick="nextCall()">📞 NEXT CALL ➡️</button></div>'); }
function callDoneWithPenalty(){ showStage('<div class="card" style="text-align:center"><div style="font-size:50px">⚠️</div><h2>NADALA NA, PERO...</h2><p><b>'+currentCase.id+'</b> - Nadala na, pero may mali kang assessment. Lumala pasyente.</p><p>Score: '+score+' | Lives: '+("❤️".repeat(lives))+'</p><button class="bigBtn" onclick="nextCall()">📞 NEXT CALL ➡️</button></div>'); }
function showFired(){
  clearInterval(timerInt); playFired();
  showStage('<div class="card" style="text-align:center;border:4px solid #FF1744"><div style="font-size:45px">💥🚨</div><h2 style="color:#FF1744">YOU\'RE FIRED!</h2>'+getFiredScene()+'<div style="background:#FF1744;color:white;padding:10px;border-radius:10px;font-weight:900;font-size:15px;line-height:1.4;margin:8px 0">MAG RE-TRAIN KA!<br>BUHAY ANG HAWAK MO<br>TAPOS GANYAN ASSESSMENT MO!<br><span style="font-size:20px">YOU\'RE FIRED! 🔥</span></div><div style="background:#FFE600;border:3px solid #FF1744;padding:10px;border-radius:10px;font-weight:900;font-size:15px;line-height:1.4;margin:8px 0">😭 PASYENTE: KAKASUHAN KITA!<br>DI KA MARUNONG! ⚖️</div><div style="background:#B3E5FC;border:3px solid #0A2A7A;padding:10px;border-radius:10px;font-weight:900;font-size:15px;line-height:1.4;margin:8px 0">🥺 ER: ARAM MO BOSS, SORRY NA...<br>PATAWAD NA, DAI KO NA UULITON! 😭🙏</div><p><b>'+erName+'</b>, ubos na 3 lives mo.<br>Final Score: '+score+'</p><button class="bigBtn" onclick="location.reload()" style="background:linear-gradient(#FF1744,#FF6A00)">🔄 MAG RE-TRAIN AT MAG-DUTY ULIT!</button></div>');
}
function endGame(){
  clearInterval(timerInt); playWin();
  var rank = score>=1300 ? "🏆 BEST RESPONDER NG BASUD!" : score>=900 ? "👍 MAGALING! Pang-team leader ka na!" : score>=500 ? "📚 OKAY PA, REVIEW PA!" : "📚 KAILANGAN MAG-REVIEW!";
  showStage('<div class="card" style="text-align:center"><div style="font-size:50px">🎉</div><h2>TAPOS NA DUTY MO!</h2>'+getSuccessScene()+'<div style="background:#6BCB77;color:white;padding:10px;border-radius:10px;font-weight:900;font-size:15px;line-height:1.4;margin:8px 0">🎉 PROMOTED KA NA!<br>BILANG REGULAR NA JOB ORDER!<br><span style="font-size:13px">DAGDAG TRABAHO, DATI LANG ANG SWELDO! 😅</span></div><div style="background:#FFE600;border:3px solid #0A2A7A;padding:10px;border-radius:10px;font-weight:900;font-size:14px;line-height:1.4;margin:8px 0">😊 PASYENTE: SALAMAT ER!<br>ITO PANG-MERYENDA MO! 💸</div><div style="background:#B3E5FC;border:3px solid #0A2A7A;padding:10px;border-radius:10px;font-weight:900;font-size:14px;line-height:1.4;margin:8px 0">🥺 ER: SALAMAT SIR, ARAY MO PAKAK! 😭🙏</div><p>Final Score: '+score+' / 1500<br>Lives natira: '+("❤️".repeat(lives))+'<br>Calls: 5/5</p><p style="background:#FFE600;padding:9px;border-radius:10px;font-weight:900">'+rank+'</p><p>Maray na Bagong Taon, '+erName+'!<br>Saludo kami, MDRRMO Basud!</p><button class="bigBtn" onclick="location.reload()">🔄 MAG-DUTY ULIT!</button></div>');
}
startScreen();
</script>
